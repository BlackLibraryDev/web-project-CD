<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicons/apple-icon-180x180.png">
    <title>Defend your castle</title>
    <!-- 매니페스트 링크 -->
    <link rel="manifest" href="./manifest.json">
    
    <script>
        // 💡 여기에 마지막으로 저장(업데이트)한 시간을 전역 변수로 기록합니다.
        window.GAME_VERSION = "260814 05:35:00"; // 예시: "2024-06-01 12:00:00"
    </script>
    <!-- Phaser 3 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #333; }
        canvas { box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <script src="preload.js"></script>
    <script src="SaveLoadScene.js"></script>
    <script src="MainMenuScene.js"></script>
    <script src="UIScene.js"></script>
    <script src="GameScene.js"></script>
    <script src="main.js"></script>
    <script>
        // 서비스 워커 등록 코드
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('서비스 워커 등록 성공:', reg.scope))
                    .catch(err => console.log('서비스 워커 등록 실패:', err));
            });
        }
    </script>
</body>
</html>
